<style>
/* Layout concept: a 1920x1080 stage scaled to fit; sand backdrop, white panel, black header band with the logo.
   Slides swap inside the panel with direction-aware motion; one set of markup serves Arabic (rtl) and English (ltr). */
:root{
  --sand:#D8D3CB; --ink:#191919; --mut:#55504A;
  --lime:#DDAE85; --limed:#8A5228; --red:#F2574A; --redd:#C62D3D;
  --card:#FFFFFF; --line:#DEDAD3; --hl:#D93A2B;
  --ease:cubic-bezier(.2,.8,.2,1);
  --f:'SMA Text',Arial,sans-serif;
  --mono:'SMA Mono',ui-monospace,monospace; /* taste-skill-ignore: interface fragment or overlay */
  --d:1; --flip:1; --sc:1; --so:0%;
  color-scheme:light;
}
html[dir=rtl]{--d:-1;--flip:-1;--so:100%}
html[lang=en]{--f:'SMA Text',Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;margin:0;background:#111;color:var(--ink);overflow:hidden}
body{display:flex;flex-direction:column;font-family:var(--f);font-size:16px}
p,h1,h2,h3,ol,ul{margin:0;padding:0}
button{font-family:inherit}

#app{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;background:#111}
#stage{--W:1920px;--H:1080px;--px:calc((var(--W) - 1664px) / 2);position:absolute;left:50%;top:50%;width:var(--W);height:var(--H);margin-left:calc(var(--W) / -2);margin-top:calc(var(--H) / -2);transform:scale(var(--sc));transform-origin:50% 50%}
.panel{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff}
.band{height:96px;background:#111;display:flex;align-items:center;gap:24px;padding:0 var(--px);position:relative}
.band img{width:203px;height:44px;object-fit:contain;flex:none}
.sp{flex:1}
.blab{color:var(--lime);font-weight:700;font-size:24px}
html[lang=en] .blab{letter-spacing:2px;text-transform:uppercase}
.btag{color:#C9BFAE;font-weight:600;font-size:24px}
html[lang=en] .btag{letter-spacing:1px;text-transform:uppercase}
.chips{display:flex;gap:10px}
.chp{font-size:24px;font-weight:600;padding:5px 18px;border:0;color:#C9BFAE;transition:background .5s,color .5s,border-color .5s}
.chp.on{background:var(--lime);border-color:var(--lime);color:#111;font-weight:700}
.chp.on.red{background:var(--red);border-color:var(--red)}
.prog{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.12)}
.prog i{display:block;height:100%;background:var(--lime);transform-origin:var(--so) 50%;transform:scaleX(var(--p,0));transition:transform .7s var(--ease)}

#slides{position:absolute;left:0;right:0;top:96px;bottom:0;overflow:hidden}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;padding:48px var(--px) 56px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;
  opacity:0;visibility:hidden;transform:translateX(calc(var(--d) * 7%));
  transition:opacity .45s,transform .6s var(--ease),visibility 0s .6s}
.slide.bef{transform:translateX(calc(var(--d) * -7%))}
.slide.act{opacity:1;visibility:visible;transform:none;transition:opacity .5s .1s,transform .75s var(--ease) .1s,visibility 0s}
.slide.lime{background:var(--lime)}

/* reveal choreography: elements start hidden only while their animation waits (backwards fill), so the resting state is always complete */
.go .a{animation:rise .75s var(--ease) backwards;animation-delay:calc(var(--i,0) * 90ms + 150ms)}
.go .a.pop{animation-name:pop}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
@keyframes pop{from{opacity:0;transform:scale(.86)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes dash{from{stroke-dasharray:0 942.5}}
@keyframes ring{from{stroke-dasharray:0 691.2}}
@keyframes draw{from{stroke-dashoffset:2400}}
@keyframes close{from{transform:translateY(-46px)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.06)}}
@keyframes scan{0%,100%{top:6%}50%{top:88%}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes alertp{0%,100%{transform:none}50%{transform:scale(1.015)}}

/* type */
.h2{font-size:60px;font-weight:800;line-height:1.25}
.lab{font-size:28px;font-weight:700;color:var(--limed)}
html[lang=en] .lab{letter-spacing:2px;text-transform:uppercase;font-size:26px}
.lab.red{color:var(--redd)}
.term{font-size:30px;font-weight:700;letter-spacing:2px;color:var(--limed)}
.lead{font-size:36px;line-height:1.5}
.mut{color:var(--mut)}
.foot{font-size:40px;font-weight:700;line-height:1.35}
.foot .g{color:var(--limed)} .foot .r{color:var(--redd)}
.src{font-size:24px;line-height:1.4;color:var(--mut)}
h3{font-size:38px;font-weight:800;line-height:1.3}
.ltr{direction:ltr;unicode-bidi:isolate}

/* layout helpers */
.col{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column}
.row{display:flex;gap:28px;align-items:stretch}
.row>*{flex:1;min-width:0}
.two{display:flex;gap:64px;flex:1;min-height:0}
.two>.col{flex:1;min-width:0;justify-content:space-between;gap:28px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:var(--card);border:0;border-radius:6px;padding:30px;display:flex;flex-direction:column;gap:16px;transition:transform .3s var(--ease),box-shadow .3s}
.card:hover{transform:translateY(-6px);}

const qr=()=>{const n=11,s=10;let r='',x=7;const rnd=()=>(x=(x*73+41)%251);

  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const f=(i<4&&j<4)||(i>6&&j<4)||(i<4&&j>6);if(!f&&rnd()%2)r+=`<rect x="${i*s}" y="${j*s}" width="${s}" height="${s}" fill="#111"/>`}

return `<div class="split"><div class="side" style="justify-content:flex-start;gap:26px"><div class="stack" style="gap:12px"><h2 class="h2 a" style="--i:1">${a.spot||t.spot}</h2></div>

['mail',s.email.h,`<div class="mini"><b>${s.email.subj}</b><small class="ltr">${s.email.addr}</small></div>`],
['chat',s.wa.h,`<div class="mini wa2"><div>${s.wa.msg}</div></div>`],
['sms',s.sms.h,`<div class="mini sm2"><div>${s.sms.msg} ${L(s.sms.url)}</div></div>`],
['phone',s.call.h,`<div class="mini call"><div class="cv">?</div><div class="ct"><b>${s.call.who}</b>${s.call.sub}</div><span class="no"></span><span class="ok"></span></div>`],
['globe',s.web.h,`<div class="mini fk"><div class="u">${s.web.url}</div><div class="bd"><span class="bb">${s.web.btn}</span><span class="ln"></span></div></div>`],
['qr',s.qr.h,`<div class="mini qrr"><div class="qrb">${qr()}</div><span>${s.qr.msg}</span></div>`]];
return `${hdr(s.h2)}<div class="g3">${cards.map((c,j)=>`<div class="card rcard a" style="--i:${j+1}"><div class="rh"><div class="tile sm">${ic(c[0])}</div><h3>${c[1]}</h3></div>${c[2]}</div>`).join('')}</div><p class="src a" style="--i:8">${s.note}</p>`};

const report=t=>{const s=t.s.report;const ics=['mail','link','lock','search'];
return `${hdr(s.h2)}<div class="rep"><div class="rlist"><h3 class="a" style="--i:1">${s.listH}</h3>${s.items.map((x,j)=>`<div class="ritem a" style="--i:${j+2}"><div class="tile">${ic(ics[j])}</div><span>${x}</span></div>`).join('')}</div>
<div class="how a" style="--i:3"><h3>${s.howH}</h3><div class="hs"><i>1</i><div><b>${s.s1}</b></div></div><div class="hs"><i>2</i><div><b>${s.s2}</b><small class="ltr2">${s.s2a}</small><small class="ltr2">${s.s2b}</small></div></div><div class="hs"><i>3</i><div><b>${s.s3}</b></div></div><p class="none">${s.none}</p></div></div>`};

const take=t=>{const s=t.s.take;
return `${hdr(s.h2)}<div class="tk">${s.items.map((x,j)=>`<div class="tkr ${j===4?'last':''} a" style="--i:${j+1}"><span class="nn">${j+1}</span><span>${x}</span></div>`).join('')}</div>`};

const close=t=>{const s=t.s.close;
return `<div class="close"><div class="txt"><h1>${s.w.map((w,j)=>`<span class="a" style="--i:${j+1};display:block">${w}</span>`).join('')}</h1><p class="p a" style="--i:5">${s.p}</p><div class="ty a" style="--i:6"><b>${s.ty}</b><span>${s.q}</span></div><p class="ft a" style="--i:7">${s.ft}</p></div><div class="art2 a pop" style="--i:1">${arch(s.alt)}</div></div>`};

const agenda=t=>{const s=t.s.agenda,keys=['basics','why','how','attacks','role'];
  const first=k=>SL.findIndex(x=>x.sec===k),last=k=>SL.map(x=>x.sec).lastIndexOf(k);
  return `${hdr(s.h2)}<div class="agd">${s.items.map((x,j)=>{const a=first(keys[j])+1,b=last(keys[j])+1;
    return `<button class="agr a" type="button" data-go="${a-1}" style="--i:${j+1}"><span class="agn">${j+1}</span><span class="agt"><b>${x[0]}</b><small>${x[1]}</small></span><span class="agp"><i>${s.sl}</i> ${L(a===b?a:a+'–'+b)}</span></button>`}).join('')}</div>`};
const part=j=>t=>{const s=t.s.agenda,x=s.items[j];
  return `<div class="dv"><div class="dvl"><h1 class="dvt a" style="--i:1">${x[0]}</h1><p class="dvd a" style="--i:2">${x[1]}</p>${j===4?`<p class="dvq a" style="--i:3">${t.s.uaeHuman.quote}</p><p class="dvb a" style="--i:4">${t.s.uaeHuman.by}</p>`:''}</div>
<div class="dvr">${s.items.map((y,k)=>`<div class="dvi ${k===j?'on':''} a" style="--i:${k+2}"><b>${k+1}</b><span>${y[0]}</span></div>`).join('')}</div></div>`};
/* ---------- added: AI-powered attacks, and the two locks on an account ---------- */
const aiSlide=t=>{const s=t.s.ai,ics=['mail','mic','video'];
return `<div class="stack" style="gap:12px"><h2 class="h2 a">${s.h2}</h2><p class="lead mut a" style="--i:1;font-size:32px">${s.lead}</p></div>
<div class="aiw"><div class="ail">${s.rows.map((x,j)=>`<div class="card air a" style="--i:${j*2+2}"><div class="tile">${ic(ics[j])}</div><div class="ait"><h3>${x[0]}</h3><p class="was"><em>${s.was}</em><span>${x[1]}</span></p><p class="now"><em>${s.now}</em><span>${x[2]}</span></p></div></div>`).join('')}</div>
<div class="aib a" style="--i:8">${ring(90,cnt(90,{suf:'%+',dur:1300,del:900}))}<p class="ais">${s.stat}</p><div class="aiv"><b>${s.ruleH}</b><span>${s.rule}</span></div></div></div>
<p class="src a" style="--i:10">${s.src}</p>`};

const locks=t=>{const s=t.s.locks;
return `<div class="stack" style="gap:12px"><h2 class="h2 a">${s.h2}</h2><p class="lead mut a" style="--i:1;font-size:32px">${s.lead}</p></div>
<div class="row lk">
<div class="card lkc a" style="--i:2"><div class="rh"><div class="tile">${ic('key')}</div><div><h3>${s.h1}</h3></div></div>
<ul class="lkl">${s.p1.map(x=>`<li>${x}</li>`).join('')}</ul>
<div class="cmp"><div><em class="badc">${s.weak}</em><span class="ltr">Sharjah@2026</span></div><div><em class="okc">${s.strong}</em><span class="ltr">falcon-coffee-lantern-tide</span></div></div></div>
<div class="lkp a" style="--i:4" aria-hidden="true">+</div>
<div class="card lkc a" style="--i:5"><div class="rh"><div class="tile">${ic('phone2')}</div><div><h3>${s.h2b}</h3></div></div>
<ul class="lkl">${s.p2.map(x=>`<li>${x}</li>`).join('')}</ul>
<div class="mini mfa"><div class="mft"><b>${s.pushT}</b><small>${s.pushS}</small></div><span class="mfn">${s.deny}</span><span class="mfy">${s.approve}</span></div></div>
</div>
<div class="alert a" style="--i:8"><div class="ib">${ic('warn')}</div><p><b>${s.q}</b> ${s.a}</p></div>`};

/* ---------- slide registry ---------- */
const SL=[
{id:'cover',lab:'cover',f:cover},
{id:'agenda',lab:'agenda',f:agenda},
{id:'part-1',lab:'basics',sec:'basics',cls:'lime',f:part(0)},
{id:'what-is',lab:'basics',sec:'basics',f:whatIs},
{id:'part-2',lab:'why',sec:'why',cls:'lime',f:part(1)},
{id:'why',lab:'why',sec:'why',f:why},
{id:'uae-daily',lab:'why',sec:'why',f:uaeDaily},
{id:'uae-emirates',lab:'why',sec:'why',f:uaeEm},
{id:'part-3',lab:'how',sec:'how',cls:'lime',f:part(2)},
{id:'entry',lab:'how',sec:'how',f:entry},
{id:'target',lab:'how',sec:'how',f:target},
{id:'tricks',lab:'how',sec:'how',f:tricks},
{id:'part-4',lab:'attacks',sec:'attacks',cls:'lime',f:part(3)},
{id:'phish-a',k:0,sec:'attacks',on:[1,2],f:t=>atkA(t,0)},{id:'phish-b',k:0,sec:'attacks',on:[3],f:t=>atkB(t,0)},
{id:'imp-a',k:1,sec:'attacks',on:[1,2],f:t=>atkA(t,1)},{id:'imp-b',k:1,sec:'attacks',on:[3],f:t=>atkB(t,1)},
{id:'mal-a',k:2,sec:'attacks',on:[1,2],f:t=>atkA(t,2)},{id:'mal-open',k:2,sec:'attacks',on:[2],f:malOpen},{id:'mal-b',k:2,sec:'attacks',on:[3],f:t=>atkB(t,2)},
{id:'cred-a',k:3,sec:'attacks',on:[1,2],f:t=>atkA(t,3)},{id:'cred-use',k:3,sec:'attacks',on:[2],f:credUse},{id:'cred-b',k:3,sec:'attacks',on:[3],f:t=>atkB(t,3)},
{id:'ai',lab:'attacks',sec:'attacks',f:aiSlide},
{id:'what-to-do',lab:'attacks',sec:'attacks',f:todo},
{id:'part-5',lab:'role',sec:'role',cls:'lime',f:part(4)},
{id:'locks',lab:'role',sec:'role',f:locks},
{id:'shared',lab:'role',sec:'role',f:shared},
{id:'report',lab:'role',sec:'role',f:report},
{id:'takeaways',lab:'role',sec:'role',f:take},
{id:'closing',lab:'close',f:close,cls:'lime'}
];

/* ---------- app ---------- */
let lang='ar',cur=0,t=D.ar,slides=[],goTimer=0,ctok=0,ovOpen=false;
const app=$('#app'),stage=$('#stage'),host=$('#slides');

/* the stage is 1920x1080 on a 16:9 screen and grows to the screen's own shape (4:3 up to ultra-wide), so no bars show */
function fit(){const r=app.getBoundingClientRect();if(!r.width||!r.height)return;
  /* phones (either way up) and portrait tablets get a narrow canvas so text stays readable; slides scroll inside */
  const small=Math.min(r.width,r.height)<=520||(r.width<=900&&r.height>r.width);
  document.documentElement.classList.toggle('mob',small);
  if(small){const s0=Math.min(r.width,r.height)<=520 ? 0.68 : 0.8,W=Math.round(r.width/s0),sc=r.width/W,H=Math.round(r.height/sc);
    stage.style.setProperty('--W',W+'px');stage.style.setProperty('--H',H+'px');stage.style.setProperty('--sc',sc.toFixed(4));return}
  const a=Math.max(1.4,Math.min(2.4,r.width/r.height));
  const W=a>=16/9?Math.round(1080*a):1920,H=a>=16/9?1080:Math.round(1920/a);
  stage.style.setProperty('--W',W+'px');stage.style.setProperty('--H',H+'px');
  stage.style.setProperty('--sc',Math.max(.1,Math.min(r.width/W,r.height/H)).toFixed(4))}

const put=(e,v)=>{e.innerHTML=v.replace(/[,.]/g,'<i class="sep">$&</i>')};
function counters(s){const my=++ctok;
  s.querySelectorAll('.cnt').forEach(e=>{const n=+e.dataset.n,d=+e.dataset.d,suf=e.dataset.suf,dur=+(e.dataset.dur||1500),del=+(e.dataset.del==null?350:e.dataset.del);
    const fmt=v=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})+suf;
    if(reduce){put(e,fmt(n));return}
    put(e,fmt(0));const t0=performance.now()+del;
    const step=now=>{if(my!==ctok)return;const p=Math.min(1,Math.max(0,(now-t0)/dur));put(e,fmt(n*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
    setTimeout(()=>{if(my===ctok)put(e,fmt(n))},del+dur+250); /* safety net: always land on the real number, even if the browser pauses animation frames */
  });}

function restart(s){slides.forEach(o=>{if(o!==s&&!o.classList.contains('act'))o.classList.remove('go')});
  s.classList.remove('go');void s.offsetWidth;s.classList.add('go');counters(s);
  clearTimeout(goTimer);goTimer=setTimeout(()=>slides.forEach(o=>{if(o!==slides[cur])o.classList.remove('go')}),1000)}

function setBand(){const sl=SL[cur],blab=$('#blab'),btag=$('#btag'),chips=$('#chips');
  const atk=sl.k!==undefined;
  btag.hidden=!atk;chips.hidden=!atk;blab.hidden=atk;
  if(atk){btag.textContent=t.atk.replace('{n}',sl.k+1);[...chips.children].forEach((c,i)=>{c.classList.toggle('on',sl.on.includes(i+1));c.classList.toggle('red',i===2)})}
  else blab.textContent=t.lab[sl.lab]||'';
  [blab,btag,chips].forEach(e=>{e.classList.remove('bf');void e.offsetWidth;e.classList.add('bf')})}

function go(i,quiet){i=Math.max(0,Math.min(SL.length-1,i));cur=i;
  slides.forEach((s,k)=>{s.classList.toggle('bef',k<i);s.classList.toggle('act',k===i);s.setAttribute('aria-hidden',k===i?'false':'true')});
  slides[i].scrollTop=0;restart(slides[i]);setBand();
  $('#prog').style.setProperty('--p',((i+1)/SL.length).toFixed(4));
  $('#cnt').textContent=`${i+1} / ${SL.length}`;
  $('#bPrev').disabled=i===0;$('#bNext').disabled=i===SL.length-1;
  try{history.replaceState(null,'','#'+lang+'/'+(i+1))}catch(e){}
  document.querySelectorAll('.ovi').forEach((b,k)=>b.classList.toggle('cur',k===i))}

const next=()=>go(cur+1),prev=()=>go(cur-1);

function build(){t=D[lang];
  const h=document.documentElement;h.lang=t.lang;h.dir=t.dir;document.title=t.title;
  $('#logo').alt=t.logoAlt;
  host.innerHTML=SL.map(s=>`<section class="slide ${s.cls||''}" data-id="${s.id}">${s.f(t)}</section>`).join('');
  slides=[...host.children];
  slides.forEach((s,k)=>{const e=s.querySelector('.h2,.big,h1');s.setAttribute('role','group');s.setAttribute('aria-roledescription','slide');s.setAttribute('aria-label',(k+1)+' / '+SL.length+(e?': '+e.textContent.replace(/\s+/g,' ').trim():''))});
  $('#chips').innerHTML=t.chips.map((c,i)=>`<span class="chp">${i+1}<span class="ct">  ${c}</span></span>`).join('');
  $('#tOv').textContent=t.ui.ov;$('#tLang').textContent=t.ui.lang;$('#tFs').textContent=t.ui.fs;$('#tRe').textContent=t.ui.re;$('#rot').textContent=t.ui.rot;
  $('#bPrev').setAttribute('aria-label',t.ui.prev);$('#bNext').setAttribute('aria-label',t.ui.next);$('#ovt').textContent=t.ui.ovt;
  /* overview */
  $('#ovg').innerHTML=slides.map((s,k)=>{const e=s.querySelector('.h2,.big,h1');let x=e?e.textContent.replace(/\s+/g,' ').trim():s.dataset.id;
    const sl=SL[k];if(sl.k!==undefined){const nm=t.A[sl.k].name;if(!x.startsWith(nm.slice(0,6)))x=nm+': '+x}
    return `<button class="ovi" type="button" data-k="${k}"><b>${k+1}</b><span>${x}</span></button>`}).join('');
  fit();go(cur)}

function setLang(l){lang=l;try{localStorage.setItem('smaLang',l)}catch(e){}build()}

/* controls */
$('#bPrev').onclick=prev;$('#bNext').onclick=next;$('#bRe').onclick=()=>restart(slides[cur]);
$('#bLang').onclick=()=>setLang(lang==='ar'?'en':'ar');
function openOv(){ovOpen=true;$('#ov').hidden=false;const c=$('.ovi.cur');if(c)c.focus()}
function closeOv(){ovOpen=false;$('#ov').hidden=true}
$('#bOv').onclick=openOv;
$('#ov').addEventListener('click',e=>{const b=e.target.closest('.ovi');if(b){go(+b.dataset.k);closeOv();return}if(e.target.id==='ov')closeOv()});
const fsBtn=$('#bFs');
const de=document.documentElement,fsOn=document.fullscreenEnabled||document.webkitFullscreenEnabled,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
if(fsOn&&(de.requestFullscreen||de.webkitRequestFullscreen)){fsBtn.onclick=()=>{try{if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}catch(e){}}}else fsBtn.hidden=true;

document.addEventListener('keydown',e=>{
  if(ovOpen){if(e.key==='Escape')closeOv();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const rtl=t.dir==='rtl',onBtn=e.target&&e.target.closest&&e.target.closest('button');
  switch(e.key){
    case 'ArrowRight':rtl?prev():next();break;
    case 'ArrowLeft':rtl?next():prev();break;
    case 'ArrowDown':case 'PageDown':next();break;
    case 'ArrowUp':case 'PageUp':prev();break;
    case ' ':case 'Enter':if(onBtn)return;next();break;
    case 'Backspace':prev();break;
    case 'Home':go(0);break;
    case 'End':go(SL.length-1);break;
    case 'g':case 'G':case 'o':case 'O':openOv();break;
    case 'l':case 'L':setLang(lang==='ar'?'en':'ar');break;
    case 'f':case 'F':if(!fsBtn.hidden)fsBtn.click();break;
    case 'r':case 'R':restart(slides[cur]);break;
    default:return}
  e.preventDefault()});

let tx=null;
let ty=0;
app.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
app.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)<50||Math.abs(dx)<1.5*Math.abs(dy))return;const rtl=t.dir==='rtl';(dx<0)!==rtl?next():prev()},{passive:true});

host.addEventListener('mouseover',e=>{
  const s=e.target.closest('.sign');if(s){const sc=s.closest('.slide');sc.querySelectorAll('.pinb').forEach(p=>p.classList.toggle('hot',p.dataset.n===s.dataset.n));s.classList.add('hot')}
  const c=e.target.closest('.rc');if(c){const sc=c.closest('.slide');sc.querySelectorAll('.rgc').forEach(r=>r.classList.toggle('on',r.dataset.n===c.dataset.n));c.classList.add('on')}});
host.addEventListener('mouseout',e=>{
  const s=e.target.closest('.sign');if(s){const sc=s.closest('.slide');sc.querySelectorAll('.pinb.hot').forEach(p=>p.classList.remove('hot'));s.classList.remove('hot')}
  const c=e.target.closest('.rc');if(c){const sc=c.closest('.slide');sc.querySelectorAll('.rgc.on').forEach(r=>r.classList.remove('on'));c.classList.remove('on')}});

host.addEventListener('click',e=>{const r=e.target.closest('.agr');if(r)go(+r.dataset.go)});
addEventListener('hashchange',()=>{const m=location.hash.match(/^#(ar|en)?\/?(\d+)?$/);if(!m)return;
  const n=m[2]?Math.max(0,Math.min(SL.length-1,+m[2]-1)):cur;
  if(m[1]&&m[1]!==lang){lang=m[1];cur=n;build()}else go(n)});
/* controls float over the slide and fade out when idle */
const bar=$('#bar');let idle=0;
function wake(){bar.classList.remove('hide');clearTimeout(idle);idle=setTimeout(()=>{if(!ovOpen&&!bar.matches(':hover')&&!bar.matches(':focus-within'))bar.classList.add('hide')},3000)}
['mousemove','mousedown','touchstart','focusin'].forEach(ev=>document.addEventListener(ev,wake,{passive:true}));
document.addEventListener('keydown',e=>{if(e.key==='Tab')wake()});
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&e.detail>0)b.blur();wake()});
wake();
addEventListener('resize',fit);
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(fit,60)));
if(window.ResizeObserver)new ResizeObserver(fit).observe(app);

/* start: hash (#ar/5) > saved language > Arabic */
try{const m=location.hash.match(/^#(ar|en)?\/?(\d+)?$/);if(m){if(m[1])lang=m[1];if(m[2])cur=Math.max(0,Math.min(SL.length-1,+m[2]-1))}
  if(!(m&&m[1])){const sv=localStorage.getItem('smaLang');if(sv==='ar'||sv==='en')lang=sv}}catch(e){}
build();
window.__smaOk=1;

<div class="lbtn">تسجيل الدخول</div></div></div></div></div></div></div></section><section class="slide" data-id="ai" role="group" aria-roledescription="slide" aria-label="24 / 31: الذكاء الاصطناعي يجعل التزييف أصعب كشفًا"><div class="stack" style="gap:12px"><h2 class="h2 a">الذكاء الاصطناعي يجعل التزييف أصعب كشفًا</h2><p class="lead mut a" style="--i:1;font-size:32px">علامات التحذير القديمة تتراجع. ما يكشف الهجوم اليوم هو الطلب نفسه.</p></div>
<div class="aiw"><div class="ail"><div class="card air a" style="--i:2"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></div><div class="ait"><h3>الرسائل</h3><p class="was"><em>سابقًا</em><span>الأخطاء الإملائية كانت تكشف التزييف.</span></p><p class="now"><em>الآن</em><span>الذكاء الاصطناعي يكتب بعربية وإنجليزية سليمتين.</span></p></div></div><div class="card air a" style="--i:4"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></div><div class="ait"><h3>الأصوات</h3><p class="was"><em>سابقًا</em><span>«أعرف هذا الصوت جيدًا.»</span></p><p class="now"><em>الآن</em><span>يمكن استنساخ الصوت من ثوانٍ قليلة من التسجيل.</span></p></div></div><div class="card air a" style="--i:6"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg></div><div class="ait"><h3>المكالمات المرئية</h3><p class="was"><em>سابقًا</em><span>«رأيته على الكاميرا.»</span></p><p class="now"><em>الآن</em><span>يمكن توليد الوجه مباشرة أثناء المكالمة.</span></p></div></div></div>
<div class="aib a" style="--i:8"><div class="rg "><svg viewBox="0 0 260 260" width="260" height="260" aria-hidden="true"><circle cx="130" cy="130" r="110" fill="none" stroke="#D8D3CB" stroke-width="28"></circle><circle class="pr" cx="130" cy="130" r="110" fill="none" stroke="#BA7D4D" stroke-width="28" transform="rotate(-90 130 130)" style="--da:622.1 691.2"></circle></svg><b><span class="ltr cnt" data-n="90" data-d="0" data-suf="%+" data-dur="1300" data-del="900">90%+</span></b></div><p class="ais">من الاختراقات الرقمية أصبحت مرتبطة بالتصيّد المدعوم بالذكاء الاصطناعي.</p><div class="aiv"><b>ما الذي ينفع دائمًا؟</b><span>احكم على الطلب لا على المظهر. وعاود الاتصال برقم تعرفه مسبقًا.</span></div></div></div>
<p class="src a" style="--i:10">المصدر: مجلس الأمن السيبراني لحكومة الإمارات، حملة «النبض السيبراني». نقلته Gulf News عام 2026.</p></section><section class="slide" data-id="what-to-do" role="group" aria-roledescription="slide" aria-label="25 / 31: أيًّا كان الهجوم، افعل هذا"><div class="stack"><h2 class="h2 a" style="--i:0">أيًّا كان الهجوم، افعل هذا</h2></div><ol class="todo"><li class="tds a" style="--i:2"><b>توقّف</b><p>لا تنقر ولا تردّ ولا تفتح ولا تكتب شيئًا.</p></li><li class="aw a" aria-hidden="true" style="--i:3"><span class="arrow sm dim"></span></li><li class="tds a" style="--i:4"><b>تحقّق</b><p>تأكّد بطريقة أخرى: رقم تعرفه مسبقًا، أو عنوان تكتبه بنفسك.</p></li><li class="aw a" aria-hidden="true" style="--i:5"><span class="arrow sm dim"></span></li><li class="tds a" style="--i:6"><b>أبلغ</b><p>أخبر تقنية المعلومات فورًا، حتى إن لم تكن متأكدًا.</p></li></ol>

<div class="trk"><div class="trl"><div class="tr a" style="--i:2"><div class="tile red"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div><p class="tn">Trust</p><p class="tq">“Hi, it’s IT Support.”</p></div><div class="tr a" style="--i:5"><div class="tile red"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div><p class="tn">Urgency</p><p class="tq">“Do it in the next 10 minutes.”</p></div><div class="tr a" style="--i:8"><div class="tile red"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div><p class="tn">Fear</p><p class="tq">“Your account will be closed.”</p></div><div class="tr a" style="--i:11"><div class="tile red"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></div><p class="tn">Curiosity</p><p class="tq">“Salary review list attached.”</p></div><div class="tr a" style="--i:14"><div class="tile red"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></div><p class="tn">Authority</p><p class="tq">“This is the Director. Send it now.”</p></div></div>
<div class="slow a" style="--i:18"><div class="pz"><span class="ring"></span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1"></rect><rect x="13.5" y="5" width="4.5" height="14" rx="1"></rect></svg></div><h3>Slow down.</h3><p>Whenever a message pushes one of these buttons, that is the moment to check.</p></div></div></section><section class="slide lime" data-id="part-4" role="group" aria-roledescription="slide" aria-label="13 / 31: Four attacks to know"><div class="dv"><div class="dvl"><h1 class="dvt a" style="--i:1">Four attacks to know</h1><p class="dvd a" style="--i:2">Phishing, social engineering, malware and password attacks, how AI makes them harder to spot, and what to do</p></div>

<div class="aiw"><div class="ail"><div class="card air a" style="--i:2"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></div><div class="ait"><h3>Messages</h3><p class="was"><em>Before</em><span>Spelling mistakes gave fakes away.</span></p><p class="now"><em>Now</em><span>AI writes flawless Arabic and English.</span></p></div></div><div class="card air a" style="--i:4"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></div><div class="ait"><h3>Voices</h3><p class="was"><em>Before</em><span>“I would know that voice.”</span></p><p class="now"><em>Now</em><span>A voice can be cloned from a few seconds of audio.</span></p></div></div><div class="card air a" style="--i:6"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg></div><div class="ait"><h3>Video calls</h3><p class="was"><em>Before</em><span>“I saw them on camera.”</span></p><p class="now"><em>Now</em><span>A face can be generated live during a call.</span></p></div></div></div>
<div class="aib a" style="--i:8"><div class="rg "><svg viewBox="0 0 260 260" width="260" height="260" aria-hidden="true"><circle cx="130" cy="130" r="110" fill="none" stroke="#D8D3CB" stroke-width="28"></circle><circle class="pr" cx="130" cy="130" r="110" fill="none" stroke="#BA7D4D" stroke-width="28" transform="rotate(-90 130 130)" style="--da:622.1 691.2"></circle></svg><b><span class="ltr cnt" data-n="90" data-d="0" data-suf="%+" data-dur="1300" data-del="900">90%+</span></b></div><p class="ais">of digital breaches are now linked to AI-powered phishing.</p><div class="aiv"><b>What still works</b><span>Judge the request, not the look. Call back on a number you already know.</span></div></div></div>
<p class="src a" style="--i:10">Source: UAE Cyber Security Council, Cyber Pulse awareness campaign. Reported by Gulf News, 2026.</p></section><section class="slide" data-id="what-to-do" role="group" aria-roledescription="slide" aria-label="25 / 31: Whatever the attack, do this"><div class="stack"><h2 class="h2 a" style="--i:0">Whatever the attack, do this</h2></div><ol class="todo"><li class="tds a" style="--i:2"><b>Stop</b><p>Do not click, reply, open or type anything.</p></li><li class="aw a" aria-hidden="true" style="--i:3"><span class="arrow sm dim"></span></li><li class="tds a" style="--i:4"><b>Check</b><p>Confirm it another way: a number you already know, or an address you type yourself.</p></li><li class="aw a" aria-hidden="true" style="--i:5"><span class="arrow sm dim"></span></li><li class="tds a" style="--i:6"><b>Report</b><p>Tell IT straight away, even if you are not sure.</p></li></ol>
<div class="alert a" style="--i:8"><div class="ib"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div><p><b>Already clicked, opened or typed something?</b> Do not hide it. Disconnect from Wi-Fi and call IT now.</p></div></section><section class="slide lime" data-id="part-5" role="group" aria-roledescription="slide" aria-label="26 / 31: Your role"><div class="dv"><div class="dvl"><h1 class="dvt a" style="--i:1">Your role</h1><p class="dvd a" style="--i:2">Two locks on your account, shared responsibility, how to report, and key takeaways</p><p class="dvq a" style="--i:3">“Awareness is the first line of defence.”</p><p class="dvb a" style="--i:4">Dr Mohamed Al Kuwaiti, Chairman, UAE Cyber Security Council</p></div>
<div class="dvr"><div class="dvi  a" style="--i:2"><b>1</b><span>The basics</span></div><div class="dvi  a" style="--i:3"><b>2</b><span>Why it matters</span></div><div class="dvi  a" style="--i:4"><b>3</b><span>How attacks work</span></div><div class="dvi  a" style="--i:5"><b>4</b><span>Four attacks to know</span></div><div class="dvi on a" style="--i:6"><b>5</b><span>Your role</span></div></div></div></section><section class="slide" data-id="locks" role="group" aria-roledescription="slide" aria-label="27 / 31: Two locks on every account"><div class="stack" style="gap:12px"><h2 class="h2 a">Two locks on every account</h2><p class="lead mut a" style="--i:1;font-size:32px">A stolen password should never be enough.</p></div>
<div class="row lk">
<div class="card lkc a" style="--i:2"><div class="rh"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg></div><div><h3>Lock 1: a long passphrase</h3></div></div>
<ul class="lkl"><li>Four unrelated words beat eight clever characters.</li><li>One account, one passphrase.</li><li>Never shared, never written on a note.</li></ul>
<div class="cmp"><div><em class="badc">Weak</em><span class="ltr">Sharjah@2026</span></div><div><em class="okc">Strong</em><span class="ltr">falcon-coffee-lantern-tide</span></div></div></div>
<div class="lkp a" style="--i:4" aria-hidden="true">+</div>
<div class="card lkc a" style="--i:5"><div class="rh"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg></div><div><h3>Lock 2: multi-factor authentication (MFA)</h3></div></div>
<ul class="lkl"><li>A code or approval on your phone, on top of your password.</li><li>Never approve a request you did not start.</li><li>Never share a code. Not with IT, not with anyone.</li></ul>
<div class="mini mfa"><div class="mft"><b>Approve sign-in?</b><small>New device · location unknown</small></div><span class="mfn">Deny</span><span class="mfy">Approve</span></div></div>
</div>
<div class="alert a" style="--i:8"><div class="ib"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div><p><b>A request you did not start?</b> Deny it and tell IT. The same goes for UAE PASS requests.</p></div></section><section class="slide" data-id="shared" role="group" aria-roledescription="slide" aria-label="28 / 31: Cybersecurity is a shared responsibility"><div class="stack"><h2 class="h2 a">Cybersecurity is a <span class="g">shared responsibility</span></h2></div>
<div class="shr"><div class="shc"><div class="card rc a" data-n="1" style="--i:2;--ac:#8A5228"><h3>You</h3><p>The first to see the message, and the first to decide: open it or stop.</p></div><div class="card rc a" data-n="2" style="--i:5;--ac:#BA7D4D"><h3>Your colleagues</h3><p>We warn each other and check unusual requests together.</p></div><div class="card rc a" data-n="3" style="--i:8;--ac:#CE9B70"><h3>IT team</h3><p>Protects systems and the network, and needs your early report.</p></div><div class="card rc a" data-n="4" style="--i:11;--ac:#E6C8AE"><h3>National bodies</h3><p><span class="ln"><b>UAE Cyber Security Council:</b> coordinates efforts, publishes alerts about new vulnerabilities and urges the responsible entities to act at once.</span><span class="ln"><b>Sharjah Cyber Security Centre:</b> sets the rules, follows up government entities’ compliance and offers technical support.</span></p></div></div>
<div class="rgm"><svg viewBox="0 0 600 600" width="600" height="600" aria-hidden="true"><circle class="rgc" data-n="4" cx="300" cy="300" r="290" fill="#FAF3EC" stroke="#E6C8AE" stroke-width="3" style="--i:11"></circle><circle class="rgc" data-n="3" cx="300" cy="300" r="220" fill="#F4E7DB" stroke="#DDB695" stroke-width="3" style="--i:8"></circle><circle class="rgc" data-n="2" cx="300" cy="300" r="150" fill="#EDD8C4" stroke="#CE9B70" stroke-width="3" style="--i:5"></circle><circle class="rgc" data-n="1" cx="300" cy="300" r="80" fill="#BA7D4D" stroke="#8A5228" stroke-width="3" style="--i:2"></circle></svg><span class="rlab c a" style="top:300px;--i:3">You</span><span class="rlab  a" style="top:185px;--i:6">Colleagues</span><span class="rlab  a" style="top:115px;--i:9">IT team</span><span class="rlab  a" style="top:45px;--i:12">National bodies</span></div></div>
<p class="src a" style="--i:14">Sources: UAE Cyber Security Council advisory, 14 May 2025 (Gulf News); Sharjah Cyber Security Centre, Feb 2025 (Sharjah Update).</p>
<p class="foot a" style="--i:15">Next: how to report.</p></section><section class="slide" data-id="report" role="group" aria-roledescription="slide" aria-label="29 / 31: See something odd? Report it now."><div class="stack"><h2 class="h2 a" style="--i:0">See something odd? Report it now.</h2></div><div class="rep"><div class="rlist"><h3 class="a" style="--i:1">Report straight away:</h3><div class="ritem a" style="--i:2"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></div><span>Suspicious emails or messages</span></div><div class="ritem a" style="--i:3"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></div><span>An accidental click or opened file</span></div><div class="ritem a" style="--i:4"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div><span>Suspicious login activity</span></div><div class="ritem a" style="--i:5"><div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div><span>Anything that feels unusual</span></div></div>
<div class="how a" style="--i:3"><h3>How to report</h3><div class="hs"><i>1</i><div><b>Stop. Do not forward it.</b></div></div><div class="hs"><i>2</i><div><b>Contact IT</b><small class="ltr2">Call: <span class="ltr">06 519 7222</span></small><small class="ltr2">Email: <span class="ltr em">itservicesdesk@<wbr>sma.gov.ae</span></small></div></div><div class="hs"><i>3</i><div><b>Follow IT’s advice.</b></div></div><p class="none">Speed matters.</p></div></div></section><section class="slide" data-id="takeaways" role="group" aria-roledescription="slide" aria-label="30 / 31: Five things to remember"><div class="stack"><h2 class="h2 a" style="--i:0">Five things to remember</h2></div><div class="tk"><div class="tkr  a" style="--i:1"><span class="nn">1</span><span>Think before you click</span></div><div class="tkr  a" style="--i:2"><span class="nn">2</span><span>Verify before you trust</span></div><div class="tkr  a" style="--i:3"><span class="nn">3</span><span>Use a long passphrase and MFA</span></div><div class="tkr  a" style="--i:4"><span class="nn">4</span><span>Report suspicious activity</span></div><div class="tkr last a" style="--i:5"><span class="nn">5</span><span>Cybersecurity is everyone’s responsibility</span></div></div></section><section class="slide lime" data-id="closing" role="group" aria-roledescription="slide" aria-label="31 / 31: Stop.Check.Report."><div class="close"><div class="txt"><h1><span class="a" style="--i:1;display:block">Stop.</span><span class="a" style="--i:2;display:block">Check.</span><span class="a" style="--i:3;display:block">Report.</span></h1><p class="p a" style="--i:5">Cybersecurity is everyone’s responsibility.</p><div class="ty a" style="--i:6"><b>Thank you</b><span>Questions?</span></div><p class="ft a" style="--i:7">Sharjah Museums Authority · Cybersecurity Awareness</p></div><div class="art2 a pop" style="--i:1"><svg viewBox="0 0 520 700" width="520" height="700" role="img" aria-label="An architectural arch with a padlock inside"><path class="arch1" d="M40 680 V300 Q40 90 260 20 Q480 90 480 300 V680" fill="none" stroke="#111111" stroke-width="10"></path><path class="arch2" d="M110 680 V320 Q110 150 260 92 Q410 150 410 320 V680" fill="none" stroke="#111111" stroke-opacity="0.45" stroke-width="6"></path><path d="M0 680 H520" stroke="#111111" stroke-width="10"></path><path class="shk" d="M190 380 V330 a70 70 0 0 1 140 0 V380" fill="none" stroke="#111111" stroke-width="26"></path><g class="lockb"><rect x="150" y="370" width="220" height="190" rx="28" fill="#111111"></rect><circle cx="260" cy="446" r="22" fill="#BA7D4D"></circle><rect x="250" y="458" width="20" height="52" rx="6" fill="#BA7D4D"></rect></g></svg></div></div></section></div></div></noscript>
